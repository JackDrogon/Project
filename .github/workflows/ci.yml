name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install gofumpt
        uses: taiki-e/install-action@v2
        with:
          tool: gofumpt

      - name: Run generate via just
        run: just generate

      - name: Check generated files are up to date
        run: git diff --exit-code -- internal/adapters/templatesrc/permissions_generated.go

      - name: Run format via just
        run: just fmt

      - name: Check formatting is up to date
        run: git diff --exit-code

      - name: Run vet via just
        run: just vet

      - name: Run coverage via just
        run: just cover

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Run build via just
        run: just build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.3
          install-only: true

      - name: Run lint via just
        run: just lint

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: Run spellcheck via just
        run: just spellcheck
