name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate
        run: go generate ./...

      - name: Check generated files are up to date
        run: git diff --exit-code -- internal/adapters/templatesrc/permissions_generated.go

      - name: Format
        run: go fmt ./...

      - name: Spellcheck
        uses: crate-ci/typos@v1.35.5

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/project
